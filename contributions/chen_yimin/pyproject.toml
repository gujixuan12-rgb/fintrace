[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintrace-deterministic"
version = "1.1.0"
description = "Evidence-grounded pre-event financial risk warning agent"
requires-python = ">=3.10"

[project.optional-dependencies]
openai = ["openai>=1.0"]

[project.scripts]
fintrace = "fintrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
